<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Neon Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #080b12;
      --panel: rgba(17, 23, 35, .82);
      --panel-border: rgba(157, 177, 211, .16);
      --text: #f4f7ff;
      --muted: #8d9ab0;
      --accent: #a3ff12;
      --accent-2: #5ff3ff;
      --danger: #ff5c86;
      --shadow: 0 24px 80px rgba(0, 0, 0, .42);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --page: #eef3f8;
        --panel: rgba(255, 255, 255, .88);
        --panel-border: rgba(32, 48, 76, .14);
        --text: #172033;
        --muted: #5b6980;
        --shadow: 0 24px 80px rgba(51, 76, 111, .16);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(95, 243, 255, .08), transparent 32rem),
        radial-gradient(circle at 85% 90%, rgba(163, 255, 18, .06), transparent 30rem),
        var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    .game-shell { width: min(100%, 680px); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent-2);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.4rem); letter-spacing: -.05em; }

    .stats { display: flex; gap: 10px; }
    .stat {
      min-width: 84px;
      padding: 9px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
      text-align: right;
    }
    .stat-label { display: block; color: var(--muted); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .stat-value { display: block; margin-top: 2px; font-size: 1.15rem; font-weight: 800; }

    .board-wrap {
      position: relative;
      padding: 10px;
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      background: #0b1019;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: 12px;
      background: rgba(4, 8, 15, .74);
      backdrop-filter: blur(6px);
      text-align: center;
    }
    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 300px; }
    .overlay h2 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -.04em; }
    .overlay p { margin: 0 0 20px; color: #b2bfd2; line-height: 1.5; }

    button {
      border: 0;
      border-radius: 11px;
      padding: 11px 18px;
      color: #071006;
      background: var(--accent);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(163, 255, 18, .2);
      transition: transform .15s ease, filter .15s ease;
    }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      color: var(--muted);
      font-size: .8rem;
    }
    .hint kbd {
      padding: 3px 6px;
      border: 1px solid var(--panel-border);
      border-radius: 5px;
      color: var(--text);
      background: var(--panel);
      font: inherit;
    }
    .controls { display: none; gap: 6px; margin: 18px auto 0; width: 138px; grid-template-columns: repeat(3, 1fr); }
    .controls button { padding: 9px 0; color: var(--text); background: var(--panel); box-shadow: none; border: 1px solid var(--panel-border); }
    .controls .up { grid-column: 2; }
    .controls .left { grid-column: 1; grid-row: 2; }
    .controls .down { grid-column: 2; grid-row: 2; }
    .controls .right { grid-column: 3; grid-row: 2; }
    @media (max-width: 520px) {
      header { align-items: start; flex-direction: column; }
      .stats { width: 100%; }
      .stat { flex: 1; }
      .controls { display: grid; }
      footer { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">Arcade / 01</p>
        <h1>Neon Snake</h1>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
        <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
      </div>
    </header>

    <section class="board-wrap" aria-label="Snake game">
      <canvas id="game" width="600" height="600"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h2 id="overlay-title">Game over</h2>
          <p id="overlay-copy">You scored 0 points.</p>
          <button id="restart" type="button">Play again</button>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="Touch controls">
      <button class="up" data-direction="up" aria-label="Move up">↑</button>
      <button class="left" data-direction="left" aria-label="Move left">←</button>
      <button class="down" data-direction="down" aria-label="Move down">↓</button>
      <button class="right" data-direction="right" aria-label="Move right">→</button>
    </div>

    <footer>
      <span class="hint">Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys</span>
      <span>Eat the glow. Stay sharp.</span>
    </footer>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayCopy = document.getElementById("overlay-copy");
      const restart = document.getElementById("restart");
      const size = 24;
      const cell = canvas.width / size;
      const initialSpeed = 145;
      let snake, food, direction, nextDirection, score, best, running, timer;

      try { best = Number(localStorage.getItem("neon-snake-best")) || 0; } catch { best = 0; }
      bestEl.textContent = best;

      const randomFood = () => {
        let spot;
        do {
          spot = { x: Math.floor(Math.random() * size), y: Math.floor(Math.random() * size) };
        } while (snake.some(part => part.x === spot.x && part.y === spot.y));
        return spot;
      };

      function reset() {
        snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
        food = randomFood();
        direction = { x: 1, y: 0 };
        nextDirection = direction;
        score = 0;
        running = true;
        scoreEl.textContent = score;
        overlay.hidden = true;
        schedule();
        draw();
      }

      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(tick, Math.max(68, initialSpeed - score * 3));
      }

      function setDirection(name) {
        const directions = {
          up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
          left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
        };
        const chosen = directions[name];
        if (chosen && (chosen.x !== -direction.x || chosen.y !== -direction.y)) nextDirection = chosen;
      }

      function tick() {
        if (!running) return;
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const hitWall = head.x < 0 || head.x >= size || head.y < 0 || head.y >= size;
        const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);
        if (hitWall || hitSelf) return endGame();
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score++;
          scoreEl.textContent = score;
          if (score > best) {
            best = score;
            bestEl.textContent = best;
            try { localStorage.setItem("neon-snake-best", best); } catch {}
          }
          food = randomFood();
        } else snake.pop();
        draw();
        schedule();
      }

      function endGame() {
        running = false;
        clearTimeout(timer);
        overlayTitle.textContent = "Game over";
        overlayCopy.textContent = `You scored ${score} point${score === 1 ? "" : "s"}.`;
        overlay.hidden = false;
        draw();
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
        ctx.fill();
      }

      function draw() {
        ctx.fillStyle = "#0b1019";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(139, 162, 194, .10)";
        ctx.lineWidth = 1;
        for (let i = 0; i <= size; i++) {
          const p = i * cell + .5;
          ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(canvas.width, p); ctx.stroke();
        }
        const fx = food.x * cell + cell / 2;
        const fy = food.y * cell + cell / 2;
        ctx.shadowColor = "#ff5c86";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#ff5c86";
        ctx.beginPath(); ctx.arc(fx, fy, cell * .29, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        snake.forEach((part, index) => {
          const inset = index === 0 ? 2 : 3;
          ctx.shadowColor = "#a3ff12";
          ctx.shadowBlur = index === 0 ? 14 : 8;
          ctx.fillStyle = index === 0 ? "#c4ff54" : "#8eea18";
          roundedRect(part.x * cell + inset, part.y * cell + inset, cell - inset * 2, cell - inset * 2, 6);
        });
        ctx.shadowBlur = 0;
      }

      document.addEventListener("keydown", event => {
        const keys = { ArrowUp: "up", w: "up", ArrowDown: "down", s: "down", ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right" };
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (keys[key]) { event.preventDefault(); setDirection(keys[key]); }
        if (event.key === " " && !running) reset();
      });
      document.querySelectorAll("[data-direction]").forEach(button => {
        button.addEventListener("pointerdown", () => setDirection(button.dataset.direction));
      });
      restart.addEventListener("click", reset);
      reset();
    })();
  </script>
</body>
</html>
